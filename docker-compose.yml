# Local cluster-mode topology: one PostgreSQL instance plus three
# stateless ably-server nodes sharing it for both state and pub/sub
# (LISTEN/NOTIFY). See DESIGN.md §6.2 / §7.2.
#
#   docker compose up --build
#
# Each node is reachable on its own host port (8081/8082/8083) and all
# three share one key, so a client can attach to any of them. The `init`
# service generates that key on first run and the nodes auto-migrate the
# empty database on boot under a Postgres advisory lock, so the stack
# needs no manual setup.

name: ably-cluster

# Shared definition for every ably-server node. Compose builds the image
# once (the explicit `image:` tag is reused) and each node differs only
# in its published host port.
x-ably-node: &ably-node
  build:
    context: .
    dockerfile: Dockerfile
    # The development image, not the scratch one we publish: the
    # healthcheck below needs a shell and busybox wget, which the
    # published image deliberately has neither of (see the Dockerfile).
    target: dev
    # The image fetches the private protocol module over SSH, so the build
    # needs the host's agent forwarded (see the Dockerfile).
    ssh:
      - default
  image: ably-server:local
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    init:
      condition: service_completed_successfully
  environment:
    ABLY_SERVER_POSTGRES_DSN: postgres://ably:ably@postgres:5432/ably?sslmode=disable
  volumes:
    - ./.cluster:/etc/ably:ro
  command:
    - --config=/etc/ably/ably-server.toml
    - --mode=cluster
    - --listen=:8080
    - --log-level=info
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  # Generates the cluster's API key into .cluster on first run, before any
  # node starts. See scripts/init-cluster-key.sh.
  init:
    image: alpine:3.20
    volumes:
      - ./.cluster:/etc/ably
      - ./scripts/init-cluster-key.sh:/init-cluster-key.sh:ro
    command: ["sh", "/init-cluster-key.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ably
      POSTGRES_PASSWORD: ably
      POSTGRES_DB: ably
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ably -d ably"]
      interval: 2s
      timeout: 3s
      retries: 30

  node1:
    <<: *ably-node
    ports:
      - "8081:8080"

  node2:
    <<: *ably-node
    ports:
      - "8082:8080"

  node3:
    <<: *ably-node
    ports:
      - "8083:8080"
