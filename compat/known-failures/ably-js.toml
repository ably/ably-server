reason = "TASK-144 (open): rewind/history replay omits the collapsed append aggregate. Live append fan-out passes; only the post-detach rewind:1 replay of the latest-version projection is missing."

# --- Environment-incompatible -------------------------------------------------

[[failure]]
test = "test/rest/fallbacks.test.js::rest/fallbacks Should use the primary domain as the first attempted for every connection attempt"
reason = "Multi-host fallback can't be exercised against a single local server instance -- environment-incompatible, not a server bug."

[[failure]]
test = "test/realtime/init.test.js::realtime/init node_transports"
reason = "Environment-incompatible with the --transports web_socket restriction: the test asserts node's default transports include 'comet', but ABLY_TEST_TRANSPORTS=web_socket removes it, so the assertion sees no comet. Not a server bug -- an artifact of the transport-restricted run this list is baselined against."

[[failure]]
test = "test/rest/init.test.js::rest/init Init without any tls key should enable tls"
reason = "Client-side default-option test (rest.baseUri() with no network calls); the local-sandbox harness's global endpoint/tls overrides mask the plain-default this test checks. Confirmed still failing under the 2026-07-20 web_socket run; a harness/config-shape mismatch rather than a server behaviour."

# --- ably-js/harness bugs, not ably-server ----------------------------------

[[failure]]
test = "test/realtime/connection.test.js::realtime/connection connectionPingWithCallback"
reason = "ably-js test bug, not ably-server: this test asserts the pre-deprecation v1 callback style still works, which now directly conflicts with the new v1-callback-throws-synchronously guard (DX-1204) landed on this branch. Needs updating/removing upstream, not a server concern. (Intermittent: a given run may show it passing, so compat-gate may flag it stale.)"

[[failure]]
test = "test/realtime/resume.test.js::realtime/resume recover multiple channels"
reason = "ably-js test over-assertion, not a server gap: recover itself works against this server -- a valid recover key retains its connectionId (TASK-150) and the gap messages replay correctly on re-attach (both confirmed by live repro). The test fails only on RTN16d's `expect(connection.key).to.not.equal(originalKey)`, i.e. it requires the connectionKey to CHANGE on recover. The spec says the key MAY change, not MUST (same as the ably-go RTN15e case dismissed in TASK-150), and this server's connectionKey is deterministic (connID + HMAC), so it is byte-identical on recover. Not worth a per-connection nonce; the assertion is stronger than the spec. The swallowed throw makes it hang ~120s."

# --- Embedded-token JWTs (RSA4f) -- scope undecided, TASK-158 ----------------

[[failure]]
test = "test/rest/auth.test.js::rest/auth Rest embedded JWT"
reason = "TASK-158 (open): the test presents a JWT that carries an Ably token in a claim (RSA4f). verifyToken only accepts HS256 JWTs signed with a configured key secret; it has no embedded/inner-token handling, so it rejects the echo-signed JWT and the SDK fails trying to renew. Scope decision pending. (Also depends on reaching echo.ably.io to build the JWT.)"
[[failure]]
test = "test/rest/auth.test.js::rest/auth Rest embedded JWT with encryption"
reason = "TASK-158, same root cause as 'Rest embedded JWT' (embedded-token/RSA4f auth not implemented)."

# --- No presence grace period (DESIGN.md §12.5) -- scope decision under reconsideration, TASK-156 ---

[[failure]]
test = "test/realtime/presence.test.js::realtime/presence presence_auto_reenter"
reason = "TASK-156 (open, reconsidering this scope decision): no presence grace period across a connection resume (DESIGN.md §12.5) -- a member lives exactly as long as the connection that entered it, and connection-state resume is a non-goal, so a suspend+reconnect within any window doesn't preserve old members the way real Ably's ~2min liveness lease does. Confirmed via live repro."
[[failure]]
test = "test/realtime/presence.test.js::realtime/presence suspended_preserves_presence"
reason = "TASK-156 (open, reconsidering this scope decision): same root cause as presence_auto_reenter -- a reconnecting client's own membership isn't preserved across suspend, so its own reconnect synthesises a self-leave/re-enter the test doesn't expect. Confirmed via live repro."
