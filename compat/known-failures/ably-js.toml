# Known-failures list for the ably-js compatibility harness
# (compat/runners/ably-js/run.mjs, run from ably-server).
#
# Baselined against the 2026-07-21 web_socket run (--transports web_socket,
# ABLY_TEST_TRANSPORTS=web_socket), including the ably-js upstream harness
# fixes for the echo.ably.io (checkdelete/patch/put) and presence_sync_interruptus
# tests. The comet transport is excluded by that flag, so comet variants never
# appear in the results and are not listed here.
#
# This baseline supersedes the initial 2026-07-20 triage: the gaps filed as
# TASK-107, TASK-112, TASK-113, TASK-153, TASK-154, TASK-155 (plus a channel-
# params decode fix that unblocked resume_rewind_1) have been fixed and their
# tests now pass. What remains is non-goals, undecided-scope items, environment
# mismatches, and upstream ably-js/harness bugs.
#
# CAVEAT — flaky entry: realtime/connection connectionPingWithCallback is
# intermittent (a given run may show it passing, which makes compat-gate
# report it "stale"); don't prune it on a single green run. (The echo.ably.io
# checkdelete/patch/put and presence_sync_interruptus flakes were fixed
# upstream in ably-js and are no longer listed.)

