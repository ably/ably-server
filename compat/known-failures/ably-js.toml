# Known-failures list for the ably-js compatibility harness
# (compat/runners/ably-js/run.mjs, run from ably-server).
#
# Baselined against a full run — every transport the SDK offers, no
# --transports restriction — including the ably-js upstream harness fixes for
# the echo.ably.io (checkdelete/patch/put) and presence_sync_interruptus tests.
#
# Earlier baselines restricted the suite to web_socket, which hid the 80 comet
# variants and the 9 transport-selection tests in transports.test.js. Those all
# pass (or are skipped by the SDK itself), so the restriction is no longer worth
# the coverage it costs and no comet entries are needed here.
#
# This baseline supersedes the initial 2026-07-20 triage: the gaps filed as
# TASK-107, TASK-112, TASK-113, TASK-153, TASK-154, TASK-155 (plus a channel-
# params decode fix that unblocked resume_rewind_1) have been fixed and their
# tests now pass. What remains is non-goals, undecided-scope items, environment
# mismatches, and upstream ably-js/harness bugs.
#
# NOT LISTED, but expect to see it: rest/auth "authCallback is only invoked
# once on concurrent auth" fails intermittently (2 of 5 observations on
# 2026-08-17). It fires two concurrent channel.history() calls and asserts
# ably-js coalesces them into a single authCallback invocation, which is the
# SDK's own dedupe guarantee — the server only supplies the timing, and a local
# server is fast enough to interleave them differently than the cloud does. It
# has no entry because it passes on most runs, and an entry would make the gate
# report it stale more often than it reports it failing. If a run shows it, it
# is this, not a regression.
#
# CAVEAT — flaky entry: realtime/connection connectionPingWithCallback is
# intermittent (a given run may show it passing, which makes compat-gate
# report it "stale"); don't prune it on a single green run. (The echo.ably.io
# checkdelete/patch/put and presence_sync_interruptus flakes were fixed
# upstream in ably-js and are no longer listed.)

