# Known-failures list for the ably-ai-transport-js compatibility harness
# (compat/runners/ably-ai-transport-js/run.mjs, run from ably-server).
#
# The suite is ably-ai-transport-js's integration specs (test/**/*.integration.test.ts,
# 73 tests across 7 files) driven against a local ably-server via the sandbox
# provisioner. It stresses exactly ably-server's newest surface: streamed appends
# on mutable channels, update/delete, history pagination, resume continuity, and
# attach modes — no presence/annotations/LiveObjects/push.
#
# cmd/compat-gate diffs the runner's JSON report against this file: a failing test
# not listed here is a regression (or an untracked gap); a listed entry that ISN'T
# currently failing is stale and must be pruned. Every entry carries a reason (a
# backlog task reference or a non-goal marker) — the list is meant to be read.
#
# THE LIST IS EMPTY, AND SHOULD STAY THAT WAY. Re-baselined 2026-08-19 against
# ably-ai-transport-js d7a9ed15 (v0.8.0): the suite is a deterministic 73/73
# (four consecutive green runs) against a provisioner-booted ably-server. The
# sole prior entry — a suspend/resume run-completion timeout — was an upstream
# client-side race in the SDK's own test helper (awaitRunComplete fell back to
# the tree's structural `update` event, which never fires for a status-only
# run-end); ably-ai-transport-js#276 (bc60790) fixed it to listen on `run`
# instead, and the test now passes deterministically. Anything failing here now
# is a regression.
